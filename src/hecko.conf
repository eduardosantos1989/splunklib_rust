[http::debprog]
# ingest = custom   # JSON array body, metadata as query params, no auth (default)
# ingest = hec      # Splunk HEC envelopes + Authorization: Splunk <token>
url = https://127.0.0.1:8088/services/collector/event
token = YOUR_HEC_TOKEN
file = $SPLUNK_HOME/var/log/splunk/debprog.log
index = main
source = debprog
sourcetype = _json
verify_ssl = true
