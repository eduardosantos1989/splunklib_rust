[package]
name = "splunklib_rust"
version = "0.3.0"
edition = "2024"

[dev-dependencies]
tempfile = "3.27.0"

[lib]
path = "lib/mod.rs"

[dependencies]
hostname = "0.4.2"
walkdir = "2.5.0"
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "gzip",
    "stream",
    "native-tls",
] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
thiserror = "2.0.20"
flate2 = "1.1.9"
once_cell = "1.21.4"
tracing = "0.1.44"
url = "2.5.8"
bytes = "1.12.1"
futures-util = "0.3.34"
arc-swap = "1.9.2"
dashmap = "6.2.1"
uuid = { version = "1.24.1", features = ["v4", "v7"] }
crossbeam-channel = "0.5.16"
rand = "0.10.2"

[target.'cfg(not(target_has_atomic = "64"))'.dependencies]
portable-atomic = "1.15.0"

# Use vendored OpenSSL only on Unix (Windows uses SChannel via native-tls automatically)
[target.'cfg(unix)'.dependencies.reqwest]
version = "0.13.4"
default-features = false
features = ["json", "gzip", "stream", "native-tls", "native-tls-vendored"]
